name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: Check Bash syntax
        run: |
          bash -n bootstrap.sh install.sh bin/proxmox-os-installer tests/test_bootstrap.sh tests/test_update.sh
          bash -n tests/test_dry_run.sh tests/test_provision.sh tests/test_provision_flow.sh tests/test_provision_failures.sh tests/test_credential_leak.sh tests/test_firstboot_ssh.sh
      - name: ShellCheck
        run: shellcheck -e SC1091 bin/proxmox-os-installer install.sh lib/common.sh lib/interactive.sh lib/install_aliases.sh
      - name: Bootstrap non-executable installer regression
        run: sudo bash tests/test_bootstrap.sh
      - name: Install alias collision tests
        run: bash tests/test_install_aliases.sh
      - name: Self-update regression tests
        run: bash tests/test_update.sh
      - name: Python unit tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Dry-run mock (no VM created)
        run: sudo bash tests/test_dry_run.sh
      - name: Provision mocks (no VM created)
        run: |
          sudo bash tests/test_provision.sh
          sudo bash tests/test_provision_flow.sh
          sudo bash tests/test_provision_failures.sh
          sudo bash tests/test_credential_leak.sh
          sudo bash tests/test_firstboot_ssh.sh
      - name: Upstream check (network, non-blocking)
        run: |
          python3 lib/image_catalog.py check-upstream catalog/os-images.tsv || \
            echo "Upstream check failed (network or mirror); offline tests still passed."
